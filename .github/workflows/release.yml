name: Release my-tv APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # 允许在 Actions 页面手动运行

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 拉取全部 tag，版本号依赖 git describe

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub ubuntu runner 预装了 Android SDK/NDK，无需 setup-android
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build release APK
        run: ./gradlew assembleRelease -PIS_SO_BUILD=false --console=plain

      - name: Resolve version
        id: ver
        run: |
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" == v* ]]; then VERSION="${REF#v}"; else VERSION="3.0.0"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk my-tv-${{ steps.ver.outputs.version }}.apk
          ls -lh my-tv-*.apk

      - name: Verify version
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump badging app/build/outputs/apk/release/app-release.apk | grep "package:" | head -1

      - name: Upload artifact（Actions 页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: my-tv-apk
          path: my-tv-*.apk

      - name: Generate release notes
        run: |
          bash history.sh > release_notes.md
          cat release_notes.md

      - name: Upload Release（仅 tag 推送时发布到 Releases）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: my-tv-*.apk
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
